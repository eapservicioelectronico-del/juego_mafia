<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mafia en la TV</title>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--bg:#12100f;--pn:#1e1a18;--ln:#3a332e;--fg:#f2ebe0;--mu:#a69b8c;--rd:#c8372d;--gd:#e2b45a;--ok:#7bc47f;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--fg);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
body.tv{font-size:clamp(18px,2vw,34px)}
main{max-width:480px;margin:0 auto;padding:18px 16px 40px}
body.tv main{max-width:1500px;padding:3vw}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif;margin:0 0 8px}
h1{font-size:2em}.tv h1{font-size:2.4em}
p{margin:6px 0}.mu{color:var(--mu)}.ok{color:var(--ok);font-weight:600}.err{color:#ff7a70;font-weight:600}
.pn{background:var(--pn);border:1px solid var(--ln);border-radius:14px;padding:14px;margin:12px 0}
button{font:inherit;border:1px solid var(--ln);background:var(--pn);color:var(--fg);border-radius:10px;padding:12px 16px;cursor:pointer}
button.main{background:var(--rd);border-color:var(--rd);color:#fff;font-weight:700;width:100%;padding:15px;margin-top:8px}
button.sel{background:var(--gd);color:#1a1205;border-color:var(--gd);font-weight:700}
button:disabled{opacity:.4}button:focus-visible{outline:4px solid var(--gd)}
.tv button.main{width:auto;padding:.6em 1.6em;font-size:1.1em}
input{font:inherit;width:100%;padding:12px;margin-top:8px;border-radius:10px;border:1px solid var(--ln);background:var(--bg);color:var(--fg)}
ul{list-style:none;margin:0;padding:0}li{padding:7px 0;border-bottom:1px solid var(--ln)}li:last-child{border:0}
.tl{display:grid;grid-template-columns:auto 1fr;gap:4vw;align-items:center}
.code{font:700 3.2em Georgia,serif;letter-spacing:.14em;color:var(--gd)}
#qr{background:#fff;padding:12px;border-radius:12px;display:inline-block;line-height:0}
.gr{display:grid;grid-template-columns:repeat(auto-fill,minmax(8em,1fr));gap:.6em;margin:1em 0}
.pl{background:var(--pn);border:1px solid var(--ln);border-radius:12px;padding:.7em;text-align:center}
.pl.dead{opacity:.55}
.big{font-size:2.2em;font-family:Georgia,serif;margin:.2em 0}.tm{color:var(--gd);font-weight:700}
.card{margin:16px auto;width:min(250px,78%);aspect-ratio:2/3;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:16px;cursor:pointer;border:2px solid var(--ln);user-select:none}
.card.back{background:repeating-linear-gradient(45deg,var(--rd) 0 10px,#0003 10px 20px);border-color:var(--rd);font-weight:700}
.card .em{font-size:72px}.card.front{background:var(--pn);border-color:var(--gd)}
.tgt{display:block;width:100%;margin:6px 0;text-align:left}
</style>
</head>
<body>
<main id="app"></main>
<script>
const $=s=>document.querySelector(s),app=$('#app'),PFX='mafiatv-',q=new URLSearchParams(location.search);
const R={
 killer:{e:'🔪',t:'Asesino',d:'De noche elegís a quién eliminar junto a tu banda. De día, disimulá.'},
 doctor:{e:'🩺',t:'Médico',d:'Cada noche salvás a una persona del ataque. Podés salvarte a vos.'},
 prostitute:{e:'💋',t:'Prostituta',d:'Cada noche pasás la noche con alguien: esa persona no puede actuar.'},
 alcoholic:{e:'🍺',t:'Alcohólico',d:'Ciudadano sin poder de noche. Sobrevivís al primer ataque del asesino: estabas tirado y borracho.'},
 villager:{e:'🙂',t:'Ciudadano',d:'Sin poderes. Debatí de día y votá para descubrir a los asesinos.'}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const clean=n=>String(n||'').trim().slice(0,14)||'Jugador';
let mode='home',err='',peer=null,lock=null;
try{lock=navigator.wakeLock}catch(e){}
function wake(){try{lock&&lock.request('screen')}catch(e){}}

/* ================= TV (anfitrión y narrador) ================= */
let S=null,qrEl=null;
const alive=()=>Object.values(S.P).filter(p=>p.alive&&p.role);
const byConn=c=>Object.values(S.P).find(p=>p.conn===c);
function hostStart(){mode='host';err='';S={ph:'lobby',round:1,P:{},ord:[],msg:'',win:'',end:0,code:'',ready:false};wake();hostOpen();render()}
function hostOpen(){
  try{peer&&peer.destroy()}catch(e){}
  S.code=String(1000+Math.random()*9000|0);S.ready=false;qrEl=null;
  peer=new Peer(PFX+S.code);
  peer.on('open',()=>{
    S.ready=true;qrEl=document.createElement('div');
    new QRCode(qrEl,{text:location.href.split(/[?#]/)[0]+'?join='+S.code,width:280,height:280});render()});
  peer.on('disconnected',()=>{try{peer.reconnect()}catch(e){}});
  peer.on('error',e=>{if(e.type==='unavailable-id'){hostOpen();return}err='Error de conexión ('+e.type+'). Revisá internet y recargá.';render()});
  peer.on('connection',c=>{
    c.on('data',m=>onMsg(c,m));
    c.on('close',()=>{const p=byConn(c);if(!p)return;p.conn=null;
      if(S.ph==='lobby'){delete S.P[p.id];S.ord=S.ord.filter(x=>x!==p.id)}
      else chk();push();render()});
  });
}
function onMsg(c,m){
  if(!m||typeof m!=='object')return;
  if(m.t==='join'){
    const id=String(m.id||'').slice(0,30);if(!id)return;
    let p=S.P[id];
    if(p)p.conn=c;
    else{
      if(S.ph!=='lobby'||S.ord.length>=12){try{c.send({t:'full'})}catch(e){}return}
      let nm=clean(m.name),k=2;const base=nm.slice(0,12);
      while(Object.values(S.P).some(o=>o.name===nm))nm=base+k++;
      p=S.P[id]={id,name:nm,conn:c,alive:true};S.ord.push(id);
    }
    push();render();return;
  }
  const p=byConn(c);if(!p)return;
  const vip=S.ord[0]===p.id,ok=id=>S.P[id]&&S.P[id].alive;
  if(m.t==='start'&&vip)start();
  else if(m.t==='ready'&&S.ph==='reveal'){p.ready=true;chk()}
  else if(m.t==='pick'&&S.ph==='night'&&p.alive&&ok(m.to)&&(m.to!==p.id||p.role==='doctor')){p.pick=m.to;chk()}
  else if(m.t==='vote'&&S.ph==='vote'&&p.alive&&(m.to===''||(ok(m.to)&&m.to!==p.id))){p.vote=m.to;chk()}
  else if(m.t==='tovote'&&vip&&S.ph==='day')toVote();
  else if(m.t==='again'&&vip&&S.ph==='end')again();
  push();render();
}
function setPh(ph,sec){S.ph=ph;S.end=sec?Date.now()+sec*1000:0;push();render()}
function chk(){
  const al=alive().filter(p=>p.conn);
  if(S.ph==='reveal'&&al.every(p=>p.ready))toNight();
  else if(S.ph==='night'&&al.every(p=>p.pick))toDawn();
  else if(S.ph==='vote'&&al.every(p=>p.vote!==undefined))toResolve();
}
function start(){
  if(S.ph!=='lobby'||S.ord.length<4)return;
  const ids=S.ord.slice(),n=ids.length,k=Math.max(1,n>>2),d=[];
  for(let i=0;i<k;i++)d.push('killer');
  d.push('doctor');if(n>=5)d.push('prostitute');if(n>=6)d.push('alcoholic');
  while(d.length<n)d.push('villager');
  shuffle(d);
  ids.forEach((id,i)=>{Object.assign(S.P[id],{role:d[i],alive:true,ready:false,pick:null,vote:undefined,shield:false})});
  S.round=1;S.msg='';S.win='';setPh('reveal',90);
}
function toNight(){Object.values(S.P).forEach(p=>p.pick=null);setPh('night',75)}
function toDawn(){
  const al=alive(),by=r=>al.filter(p=>p.role===r),pr=by('prostitute')[0],bl=pr&&pr.pick;
  const kv={};by('killer').forEach(p=>{if(p.pick&&p.id!==bl)kv[p.pick]=(kv[p.pick]||0)+1});
  let kill=null,mx=0;for(const id in kv)if(kv[id]>mx){mx=kv[id];kill=id}
  const dc=by('doctor')[0],save=dc&&dc.id!==bl?dc.pick:null,v=kill&&S.P[kill];
  S.msg='Esta noche nadie murió.';
  if(v&&kill!==save){
    if(v.role==='alcoholic'&&!v.shield)v.shield=true;
    else{v.alive=false;S.msg='Esta noche murió '+v.name+' (era '+R[v.role].t+').'}
  }
  if(!winCheck())setPh('day',150);
}
function toVote(){Object.values(S.P).forEach(p=>p.vote=undefined);setPh('vote',60)}
function toResolve(){
  const t={};alive().forEach(p=>{if(p.vote)t[p.vote]=(t[p.vote]||0)+1});
  let top=[],mx=0;for(const id in t){if(t[id]>mx){mx=t[id];top=[id]}else if(t[id]===mx)top.push(id)}
  if(top.length===1){const v=S.P[top[0]];v.alive=false;S.msg=v.name+' fue eliminado por votación (era '+R[v.role].t+').'}
  else S.msg='Empate: nadie fue eliminado.';
  S.round++;if(!winCheck())setPh('info',9);
}
function winCheck(){
  const al=alive(),k=al.filter(p=>p.role==='killer').length;
  if(!k)S.win='pueblo';else if(k>=al.length-k)S.win='asesinos';else return false;
  setPh('end',0);return true;
}
function again(){
  Object.keys(S.P).forEach(id=>{if(!S.P[id].conn){delete S.P[id];S.ord=S.ord.filter(x=>x!==id)}else Object.assign(S.P[id],{role:null,alive:true})});
  S.msg='';S.win='';setPh('lobby',0);
}
function view(p){
  const al=alive(),v={t:'v',ph:S.ph,name:p.name,msg:S.msg,win:S.win,vip:S.ord[0]===p.id,alive:p.alive,n:S.ord.length};
  if(S.ph==='lobby')v.names=S.ord.map(i=>S.P[i].name);
  if(p.role){v.role=p.role;if(p.role==='killer')v.mates=Object.values(S.P).filter(o=>o.role==='killer'&&o!==p).map(o=>o.name)}
  if(S.ph==='reveal')v.ready=!!p.ready;
  if(S.ph==='night'||S.ph==='vote'){
    v.list=al.filter(o=>o!==p||(S.ph==='night'&&p.role==='doctor')).map(o=>({id:o.id,name:o.name}));
    v.chosen=S.ph==='night'?p.pick:p.vote;
  }
  if(S.ph==='end')v.roles=Object.values(S.P).map(o=>({name:o.name,role:o.role,alive:o.alive}));
  return v;
}
function push(){Object.values(S.P).forEach(p=>{if(p.conn&&p.conn.open){try{p.conn.send(view(p))}catch(e){}}})}
setInterval(()=>{
  if(mode!=='host'||!S.end)return;
  if(Date.now()>=S.end){const f={reveal:toNight,night:toDawn,day:toVote,vote:toResolve,info:toNight}[S.ph];f&&f()}
  else timeTxt();
},500);
function timeTxt(){const t=$('#tm');if(t&&S.end)t.textContent=Math.max(0,Math.ceil((S.end-Date.now())/1000))+' s'}

function grid(){return '<div class="gr">'+S.ord.map(id=>{const p=S.P[id];
  return '<div class="pl'+(p.alive?'':' dead')+'">'+(p.alive?'👤':'☠️ '+R[p.role].e)+'<br><b>'+esc(p.name)+'</b></div>'}).join('')+'</div>'}
function tvV(){
  let h=err?'<p class="err">'+esc(err)+'</p>':'';
  const al=alive().filter(p=>p.conn),cnt=f=>al.filter(f).length+' / '+al.length;
  if(S.ph==='lobby'){
    const n=S.ord.length;
    h+='<div class="tl"><div>'+(S.ready?'<div id="qr"></div>':'<p class="mu">Conectando…</p>')+'</div><div>'+
    '<h1>🎭 Mafia</h1><p class="mu">Escaneá el QR con el celular o entrá a esta página y usá el código</p><div class="code">'+S.code+'</div>'+
    '<h3>Jugadores · '+n+' / 12</h3>'+(n?'<div class="gr">'+S.ord.map(i=>'<div class="pl">👤<br><b>'+esc(S.P[i].name)+'</b></div>').join('')+'</div>':'<p class="mu">Esperando celulares…</p>')+
    '<button class="main" data-act="start" data-focus="1"'+(n>=4?'':' disabled')+'>▶ Jugar</button>'+(n<4?'<p class="mu">Mínimo 4 jugadores.</p>':'')+'</div></div>';
  }else if(S.ph==='reveal')h+='<h1>🃏 Miren su celular</h1><p>Cada uno ve su rol en secreto y toca Listo.</p><p class="big">'+cnt(p=>p.ready)+'</p>'+grid()+'<p class="tm" id="tm"></p>';
  else if(S.ph==='night')h+='<h1>🌙 Noche · Ronda '+S.round+'</h1><p class="big">La ciudad duerme</p><p>Todos cierran los ojos y eligen en el celular.</p><p class="big">'+cnt(p=>p.pick)+'</p>'+grid()+'<p class="tm" id="tm"></p>';
  else if(S.ph==='day')h+='<h1>☀️ Día · Ronda '+S.round+'</h1><p class="big">'+esc(S.msg)+'</p>'+grid()+'<p>Debatan en voz alta. <span class="tm" id="tm"></span></p><button class="main" data-act="tovote" data-focus="1">🗳️ Ir a votación</button>';
  else if(S.ph==='vote')h+='<h1>🗳️ Votación</h1><p>Voten en el celular a quién eliminar.</p><p class="big">'+cnt(p=>p.vote!==undefined)+'</p>'+grid()+'<p class="tm" id="tm"></p>';
  else if(S.ph==='info')h+='<h1>⚖️ Resultado</h1><p class="big">'+esc(S.msg)+'</p>'+grid()+'<p class="mu">La noche empieza enseguida…</p>';
  else h+='<h1>🏆 Ganó '+(S.win==='pueblo'?'el pueblo':'la banda de asesinos')+'</h1><p class="mu">'+esc(S.msg)+'</p><div class="gr">'+S.ord.map(i=>{const p=S.P[i];return '<div class="pl'+(p.alive?'':' dead')+'">'+R[p.role].e+'<br><b>'+esc(p.name)+'</b><br><span class="mu">'+R[p.role].t+'</span></div>'}).join('')+'</div><button class="main" data-act="again" data-focus="1">🔁 Jugar de nuevo</button>';
  return h;
}

/* ================= CELULAR (jugador) ================= */
let pid='',pname='',code='',conn=null,joined=false,lost=false,V=null,flip=false,lastPh='';
try{pid=localStorage.getItem('mafiatv-id')||'';pname=localStorage.getItem('mafiatv-name')||''}catch(e){}
if(!pid){pid=Math.random().toString(36).slice(2,12)+Date.now().toString(36);try{localStorage.setItem('mafiatv-id',pid)}catch(e){}}
function leave(){try{peer&&peer.destroy()}catch(e){}peer=null;conn=null;joined=false;mode='home';render()}
function join(c,n){
  mode='player';err='';code=c;pname=n;joined=false;lost=false;V=null;wake();
  try{localStorage.setItem('mafiatv-name',n)}catch(e){}
  try{peer&&peer.destroy()}catch(e){}
  peer=new Peer();
  peer.on('error',e=>{if(e.type==='peer-unavailable'&&!joined){err='No encontré esa sala. Revisá el código.';leave()}else if(!peer||!peer.open)setTimeout(link,2500)});
  peer.on('open',link);
  peer.on('disconnected',()=>{try{peer.reconnect()}catch(e){}});
  render();
}
function link(){
  if(mode!=='player'||!peer||peer.destroyed||!peer.open)return;
  conn=peer.connect(PFX+code,{reliable:true});const c=conn;
  const t=setTimeout(()=>{if(!c.open){if(!joined){err='No pude conectar. Revisá el código y tu internet.';leave()}else setTimeout(link,2500)}},15000);
  c.on('open',()=>{clearTimeout(t);joined=true;lost=false;c.send({t:'join',id:pid,name:pname});render()});
  c.on('data',m=>{if(m.t==='v'){if(m.ph!==lastPh){flip=false;lastPh=m.ph}V=m}else if(m.t==='full')V={t:'full'};render()});
  c.on('close',()=>{if(mode!=='player')return;lost=true;render();setTimeout(link,2500)});
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&mode==='player'&&(!conn||!conn.open)){wake();link()}});
const send=m=>{if(conn&&conn.open)conn.send(m)};
const pnl=x=>'<div class="pn">'+x+'</div>';
function roleCard(r){return '<div class="card front" data-act="flip"><div class="em">'+R[r].e+'</div><h3>'+R[r].t+'</h3><p>'+R[r].d+'</p></div>'}
function targets(list,act,chosen,none){
  return list.map(o=>'<button class="tgt'+(chosen===o.id?' sel':'')+'" data-act="'+act+'" data-id="'+o.id+'">'+esc(o.name)+'</button>').join('')+
  (none?'<button class="tgt'+(chosen===''?' sel':'')+'" data-act="vote" data-id="">Nadie</button>':'');
}
function phoneV(){
  let h=err?'<p class="err">'+esc(err)+'</p>':'';
  if(!joined)return h+'<p class="mu">Conectando…</p>';
  if(!V)return h+'<p class="mu">Conectado. Esperá…</p>';
  if(V.t==='full')return h+pnl('<p>La partida ya empezó o la sala está llena. Esperá la próxima ronda.</p>');
  if(lost)h+='<p class="err">Reconectando…</p>';
  const v=V,r=v.role;
  if(v.ph==='lobby'){
    h+=pnl('<p class="ok">✔ Estás dentro, '+esc(v.name)+'.</p><p class="mu">Conectados: '+v.n+'</p><ul>'+v.names.map(n=>'<li>'+esc(n)+'</li>').join('')+'</ul>');
    h+=v.vip?'<button class="main" data-act="start"'+(v.n<4?' disabled':'')+'>Empezar partida</button><p class="mu">Mínimo 4. También se inicia desde la TV.</p>':'<p class="mu">Esperando que empiece la partida…</p>';
    return h;
  }
  if(v.ph==='reveal'){
    h+=flip?roleCard(r)+(r==='killer'?'<p style="text-align:center"><b>Tu banda:</b> '+(v.mates.length?v.mates.map(esc).join(', '):'actuás solo')+'</p>':''):'<div class="card back" data-act="flip"><div class="em">🂠</div><p>Tocá para ver tu rol</p></div>';
    h+='<p class="mu" style="text-align:center">Que nadie mire tu pantalla.</p>';
    return h+'<button class="main" data-act="ready"'+(v.ready?' disabled':'')+'>'+(v.ready?'Esperando a los demás…':'Listo')+'</button>';
  }
  if(v.ph==='end'){
    h+=pnl('<h3>🏆 Ganó '+(v.win==='pueblo'?'el pueblo':'la banda de asesinos')+'</h3><p class="mu">'+esc(v.msg)+'</p><ul>'+v.roles.map(o=>'<li>'+(o.alive?'':'☠️ ')+R[o.role].e+' <b>'+esc(o.name)+'</b> · '+R[o.role].t+'</li>').join('')+'</ul>');
    return h+(v.vip?'<button class="main" data-act="again">Jugar de nuevo</button>':'<p class="mu">Esperando al primero que entró…</p>');
  }
  h+='<button data-act="flip" style="width:100%;margin-bottom:8px">'+(flip?'Ocultar mi rol':'Ver mi rol')+'</button>'+(flip?roleCard(r):'');
  if(!v.alive)return h+pnl('<p><b>☠️ Estás eliminado.</b> Mirá en silencio.</p>'+(v.msg?'<p class="mu">'+esc(v.msg)+'</p>':''));
  if(v.ph==='night'){
    const t={killer:'🔪 ¿A quién eliminás?',doctor:'🩺 ¿A quién salvás?',prostitute:'💋 ¿Con quién pasás la noche?',alcoholic:'🍺 Salís a tomar. ¿De quién sospechás?',villager:'🙂 Dormís. ¿De quién sospechás?'}[r];
    h+=pnl('<h3>🌙 Noche</h3><p>'+t+'</p>'+(v.chosen?'<p class="ok">Elección enviada. Podés cambiarla hasta el amanecer.</p>':'')+targets(v.list,'pick',v.chosen));
  }else if(v.ph==='day')h+=pnl('<h3>☀️ Día</h3><p><b>'+esc(v.msg)+'</b></p><p class="mu">Debatan en voz alta.</p>')+(v.vip?'<button class="main" data-act="tovote">Ir a votación</button>':'');
  else if(v.ph==='vote')h+=pnl('<h3>🗳️ Votación</h3><p>¿A quién eliminan?</p>'+targets(v.list,'vote',v.chosen,1));
  else h+=pnl('<h3>⚖️ Resultado</h3><p><b>'+esc(v.msg)+'</b></p><p class="mu">La noche empieza enseguida…</p>');
  return h;
}

/* ================= Inicio y eventos ================= */
function homeV(){
  const j=q.get('join')||'';
  let h=err?'<p class="err">'+esc(err)+'</p>':'';
  h+='<h1>🎭 Mafia</h1>';
  if(!j)h+=pnl('<p><b>Abrir en la TV</b></p><p class="mu">La TV crea la sala, muestra el QR y narra la partida.</p><button class="main" data-act="host" data-focus="1">Crear sala</button>');
  h+=pnl('<p><b>Quiero jugar</b></p><input id="nm" maxlength="14" placeholder="Tu nombre" value="'+esc(pname)+'"><input id="cd" inputmode="numeric" maxlength="4" placeholder="Código de 4 números" value="'+esc(j)+'"><button class="main" data-act="join">Unirme</button>');
  return h;
}
function render(){
  const a=document.activeElement;if(a&&a.tagName==='INPUT')return;
  document.body.className=mode==='host'?'tv':'';
  app.innerHTML=mode==='home'?homeV():mode==='host'?tvV():phoneV();
  if(mode==='host'&&S.ph==='lobby'&&qrEl){const s=$('#qr');s&&s.appendChild(qrEl)}
  if(mode==='host'){timeTxt();const b=$('[data-focus]');b&&b.focus()}
}
app.addEventListener('click',ev=>{
  const el=ev.target.closest('[data-act]');if(!el||el.disabled)return;
  const a=el.dataset.act;
  if(a==='host')return hostStart();
  if(a==='join'){
    const n=$('#nm').value.trim(),c=$('#cd').value.replace(/\D/g,'');
    if(!n||c.length!==4){err='Escribí tu nombre y el código de 4 números.';document.activeElement.blur();render();return}
    document.activeElement.blur();return join(c,n);
  }
  if(a==='flip'){flip=!flip;return render()}
  if(mode==='host'){if(a==='start')start();else if(a==='tovote'&&S.ph==='day')toVote();else if(a==='again')again();return}
  if(mode==='player'){
    if(a==='pick'||a==='vote')send({t:a,to:el.dataset.id});else send({t:a});
  }
});
render();
</script>
</body>
</html>
