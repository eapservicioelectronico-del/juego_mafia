<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mafia · Reparto de cartas</title>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
:root{--bg:#f6f3ee;--fg:#1d1b19;--muted:#6f6a63;--panel:#fff;--line:#ddd6cc;--accent:#b3261e;--accent-fg:#fff;--ok:#2e7d32;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#141211;--fg:#f1ece4;--muted:#a39b90;--panel:#201d1b;--line:#38332f;--accent:#e0584f;--accent-fg:#141211;--ok:#7bc47f;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
main{max-width:480px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:26px;margin:0 0 4px}
h2{font-size:15px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:22px 0 8px}
p{margin:6px 0}.muted{color:var(--muted)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0}
.step{display:flex;align-items:center;gap:10px}
.step b{min-width:2ch;text-align:center;font-size:20px}
button{font:inherit;border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:10px;padding:10px 14px;cursor:pointer}
button.main{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-weight:600;width:100%;padding:14px;margin-top:8px}
button:disabled{opacity:.45;cursor:default}
input{font:inherit;width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg);margin-top:8px}
ul{list-style:none;margin:0;padding:0}li{padding:6px 0;border-bottom:1px solid var(--line)}li:last-child{border:0}
.bigcode{font-size:44px;font-weight:700;letter-spacing:.12em;text-align:center;margin:6px 0}
.card{margin:18px auto;width:min(260px,80%);aspect-ratio:2/3;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:18px;cursor:pointer;border:2px solid var(--line);user-select:none}
.back{background:repeating-linear-gradient(45deg,var(--accent) 0 10px,#00000026 10px 20px);color:var(--accent-fg);font-weight:600;font-size:18px;border-color:var(--accent)}
.back .big{font-size:64px}
.front{background:var(--panel);border-color:var(--fg)}
.front .big{font-size:76px}.front h3{margin:6px 0;font-size:26px}
.tag{display:inline-block;font-size:13px;padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.code{color:var(--ok);font-weight:600}.err{color:var(--accent);font-weight:600}
</style>
</head>
<body>
<main id="app"></main>
<script>
var app = document.getElementById('app');
var mode = 'home', myid = '', conns = {}, code = '', err = '';
var cfg = { n: 6, mafia: 2 }, dealt = false, assign = {}, showAll = false, G = null, st = null;
var lobby = { names: [], n: 0 }, card = null, flipped = false, joined = false, full = false;
var name = '', hashCode = (location.hash || '').replace('#', '').replace(/\D/g, '').slice(0, 4);
try { name = localStorage.getItem('mafia-name') || ''; } catch (e) {}

var ROLES = {
  mafia:    { e: '🔫', t: 'Mafioso',  d: 'De noche elegís con tu banda a quién eliminar. De día, disimulá.' },
  doctor:   { e: '🩺', t: 'Doctor',   d: 'Cada noche podés salvar a una persona del ataque de la mafia.' },
  police:   { e: '🕵️', t: 'Policía',  d: 'Cada noche investigás a una persona: el narrador te dice si es mafioso.' },
  villager: { e: '🙂', t: 'Aldeano',  d: 'Sin poderes. Debatí de día y votá para descubrir a la mafia.' }
};
function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function deck(n, m) {
  m = Math.max(1, Math.min(m, n - 2));
  var d = [], i;
  for (i = 0; i < m; i++) d.push('mafia');
  if (n >= 5) { d.push('doctor'); d.push('police'); }
  while (d.length < n) d.push('villager');
  return d.slice(0, n);
}
function shuffle(a) { for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function ids() { return Object.keys(conns); }
function names() { return ids().map(function (k) { return conns[k].name; }); }

/* ---------- Conexión por internet (PeerJS, sin servidor propio) ---------- */
var peer = null, links = {}, hostLink = null, ready = false, PFX = 'mafia-cyd-';
function send(k, m) { var c = links[k]; if (c && c.open) { try { c.send(m); } catch (e) {} } }
function closeNet() { try { if (peer) peer.destroy(); } catch (e) {} peer = null; links = {}; hostLink = null; ready = false; }

/* ---------- Anfitrión ---------- */
function startHost() {
  mode = 'host'; err = ''; dealt = false; conns = {};
  hostOpen();
  render();
}
function hostOpen() {
  closeNet();
  code = String(Math.floor(1000 + Math.random() * 9000));
  peer = new Peer(PFX + code);
  peer.on('open', function () { ready = true; render(); });
  peer.on('disconnected', function () { try { peer.reconnect(); } catch (e) {} });
  peer.on('error', function (e) {
    if (e.type === 'unavailable-id') { hostOpen(); return; }
    err = 'Error de conexión (' + e.type + '). Revisá tu internet y recargá.'; render();
  });
  peer.on('connection', function (c) {
    c.on('data', function (msg) {
      if (msg && msg.t === 'join') {
        links[c.peer] = c;
        conns[c.peer] = { name: String(msg.name || 'Jugador').slice(0, 20) };
        if (dealt) send(c.peer, { t: 'full' }); else sendLobby();
        render();
      }
    });
    c.on('close', function () {
      delete links[c.peer];
      if (!dealt) { delete conns[c.peer]; sendLobby(); }
      render();
    });
  });
}
function sendLobby() {
  var m = { t: 'lobby', names: names(), n: cfg.n };
  ids().forEach(function (k) { send(k, m); });
}
function deal() {
  var list = ids().slice(0, cfg.n), d = shuffle(deck(list.length, cfg.mafia));
  assign = {};
  list.forEach(function (k, i) { assign[k] = d[i]; });
  list.forEach(function (k) {
    var mates = list.filter(function (o) { return o !== k && assign[o] === 'mafia'; }).map(function (o) { return conns[o].name; });
    send(k, { t: 'card', role: assign[k], mates: assign[k] === 'mafia' ? mates : [] });
  });
  ids().filter(function (k) { return list.indexOf(k) < 0; }).forEach(function (k) { send(k, { t: 'full' }); });
  dealt = true; showAll = false;
  G = { phase: 'night', round: 1, alive: {}, pick: {}, msg: '', win: '' };
  list.forEach(function (k) { G.alive[k] = true; });
  broadcast(); render();
}
function newRound() { dealt = false; G = null; assign = {}; ids().forEach(function (k) { send(k, { t: 'reset' }); }); sendLobby(); render(); }

/* ---------- Partida (maestro) ---------- */
function nm(k) { return conns[k] ? conns[k].name : '?'; }
function broadcast() {
  Object.keys(assign).forEach(function (k) { send(k, { t: 'st', phase: G.phase, round: G.round, alive: G.alive[k], msg: G.msg, win: G.win }); });
}
function winCheck() {
  var al = Object.keys(G.alive).filter(function (k) { return G.alive[k]; });
  var m = al.filter(function (k) { return assign[k] === 'mafia'; }).length;
  if (!m) G.win = 'pueblo'; else if (m >= al.length - m) G.win = 'mafia';
}
function dawn() {
  var p = G.pick;
  if (p.kill && p.kill !== p.save) { G.alive[p.kill] = false; G.msg = 'Esta noche murió ' + nm(p.kill) + '.'; }
  else G.msg = 'Esta noche no murió nadie.';
  G.phase = 'day'; winCheck(); broadcast(); render();
}
function out(k) {
  if (k) { G.alive[k] = false; G.msg = nm(k) + ' fue eliminado por votación.'; } else G.msg = 'Nadie fue eliminado.';
  winCheck();
  if (!G.win) { G.phase = 'night'; G.round++; G.pick = {}; }
  broadcast(); render();
}
function gameView() {
  var PH = { night: '🌙 Noche', day: '☀️ Día', vote: '🗳️ Votación' };
  var h = '<h2>' + (G.win ? 'Fin de la partida' : PH[G.phase] + ' · Ronda ' + G.round) + '</h2><div class="panel">';
  if (G.msg) h += '<p><b>' + esc(G.msg) + '</b></p>';
  if (G.win) h += '<p class="code">🏆 Ganó ' + (G.win === 'mafia' ? 'la mafia' : 'el pueblo') + '.</p>';
  h += '<ul>';
  Object.keys(assign).forEach(function (k) {
    var r = ROLES[assign[k]], a = G.alive[k], p = G.pick;
    h += '<li style="' + (a ? '' : 'opacity:.5') + '"><div class="row"><span>' + (a ? '' : '☠️ ') + r.e + ' <b>' + esc(nm(k)) + '</b></span>';
    if (a && !G.win) {
      if (G.phase === 'night') h += '<span>' + [['kill', '🔫'], ['save', '🩺'], ['check', '🕵️']].map(function (x) {
        return '<button data-act="pick" data-k="' + x[0] + '" data-id="' + k + '"' + (p[x[0]] === k ? ' style="background:var(--accent);color:var(--accent-fg)"' : '') + '>' + x[1] + '</button>';
      }).join(' ') + '</span>';
      else if (G.phase === 'vote') h += '<button data-act="out" data-id="' + k + '">Eliminar</button>';
    }
    h += '</div></li>';
  });
  h += '</ul>';
  if (!G.win) {
    if (G.phase === 'night') {
      if (G.pick.check) h += '<p class="muted">🕵️ ' + esc(nm(G.pick.check)) + (assign[G.pick.check] === 'mafia' ? ' ES mafioso.' : ' NO es mafioso.') + '</p>';
      h += '<p class="muted">🔫 víctima · 🩺 salvado · 🕵️ investigado</p><button class="main" data-act="dawn">☀️ Amanecer</button>';
    } else if (G.phase === 'day') h += '<button class="main" data-act="tovote">🗳️ Ir a votación</button>';
    else h += '<button data-act="out" data-id="" style="width:100%;margin-top:8px">Nadie (empate)</button>';
  }
  return h + '<button data-act="newround" style="width:100%;margin-top:8px">Nueva ronda (repartir de nuevo)</button></div>';
}
function banner() {
  if (!st) return '';
  var t;
  if (st.win) t = '🏆 Ganó ' + (st.win === 'mafia' ? 'la mafia' : 'el pueblo') + '.';
  else if (!st.alive) t = '☠️ Estás eliminado. Mirá en silencio.';
  else t = { night: '🌙 Noche · cerrá los ojos y esperá.', day: '☀️ Día · debatan.', vote: '🗳️ Votación · voten.' }[st.phase];
  return '<div class="panel" style="text-align:center"><p><b>' + t + '</b></p>' + (st.msg ? '<p class="muted">' + esc(st.msg) + '</p>' : '') + '</div>';
}

/* ---------- Jugador ---------- */
function join(c, n) {
  mode = 'player'; err = ''; joined = false; card = null; full = false; flipped = false;
  name = n; code = c;
  try { localStorage.setItem('mafia-name', n); } catch (e) {}
  closeNet();
  peer = new Peer();
  var t = setTimeout(function () {
    if (!joined) { err = 'No pude conectar. Revisá el código y tu internet.'; mode = 'home'; closeNet(); render(); }
  }, 15000);
  peer.on('error', function (e) {
    clearTimeout(t);
    err = e.type === 'peer-unavailable' ? 'No encontré esa sala. Revisá el código.' : 'Error de conexión (' + e.type + ').';
    mode = 'home'; closeNet(); render();
  });
  peer.on('open', function () {
    hostLink = peer.connect(PFX + c, { reliable: true });
    hostLink.on('open', function () { clearTimeout(t); hostLink.send({ t: 'join', name: n }); joined = true; render(); });
    hostLink.on('data', function (m) {
      if (m.t === 'lobby') { lobby = m; card = null; st = null; full = false; }
      else if (m.t === 'card') { card = m; flipped = false; }
      else if (m.t === 'st') { st = m; }
      else if (m.t === 'full') { full = true; }
      else if (m.t === 'reset') { card = null; st = null; full = false; flipped = false; }
      render();
    });
    hostLink.on('close', function () { err = 'El anfitrión cerró la sala.'; mode = 'home'; closeNet(); render(); });
  });
  render();
}

/* ---------- Vistas ---------- */
function stepper(label, key, min, max) {
  return '<div class="row"><span>' + label + '</span><span class="step"><button data-act="dec" data-k="' + key + '" data-min="' + min + '">−</button><b>' + cfg[key] + '</b><button data-act="inc" data-k="' + key + '" data-max="' + max + '">+</button></span></div>';
}
function render() {
  var a = document.activeElement;
  if (a && a.tagName === 'INPUT') return;
  var h = '<h1>🎭 Mafia</h1>';
  if (err) h += '<p class="err">' + esc(err) + '</p>';
  if (mode === 'home') {
    h += '<div class="panel"><p><b>Soy el anfitrión</b></p><p class="muted">Vas a ser el narrador: creás la sala y repartís las cartas.</p><button class="main" data-act="host">Crear sala</button></div>';
    h += '<div class="panel"><p><b>Quiero unirme</b></p><input id="nm" maxlength="20" placeholder="Tu nombre" value="' + esc(name) + '"><input id="cd" inputmode="numeric" maxlength="4" placeholder="Código de 4 números" value="' + esc(hashCode) + '"><button class="main" data-act="join">Unirme</button></div>';
  } else if (mode === 'host') {
    h += '<div class="panel"><p class="muted" style="text-align:center">' + (ready ? 'Código de sala' : 'Conectando…') + '</p><div class="bigcode">' + code + '</div>';
    h += '<button data-act="share" style="width:100%">Compartir enlace</button></div>';
    if (!dealt) {
      h += '<div class="panel">' + stepper('Jugadores', 'n', 3, 20) + stepper('Mafiosos', 'mafia', 1, 6) + '<p class="muted">Con 5 o más jugadores se suman un Doctor y un Policía.</p></div>';
      var c = ids().length;
      h += '<h2>Conectados · ' + c + ' / ' + cfg.n + '</h2><div class="panel">';
      h += c ? '<ul>' + names().map(function (n) { return '<li>' + esc(n) + '</li>'; }).join('') + '</ul>' : '<p class="muted">Esperando que se conecten los celulares…</p>';
      h += '<button class="main" data-act="deal"' + (c >= 3 ? '' : ' disabled') + '>' + (c >= cfg.n ? 'Repartir cartas' : 'Repartir con ' + c + ' jugadores') + '</button></div>';
    } else {
      h += gameView();
    }
  } else {
    if (!joined) h += '<p class="muted">Conectando…</p>';
    else if (full) h += '<div class="panel"><p>La partida ya empezó y no tenés lugar en esta ronda.</p></div>';
    else if (!card) {
      h += '<div class="panel"><p class="code">✔ Estás dentro, ' + esc(name) + '.</p><p class="muted">Conectados: ' + (lobby.names.length || 1) + (lobby.n ? ' / ' + lobby.n : '') + '. Esperá a que el anfitrión reparta las cartas.</p>';
      if (lobby.names.length) h += '<ul>' + lobby.names.map(function (n) { return '<li>' + esc(n) + '</li>'; }).join('') + '</ul>';
      h += '</div>';
    } else {
      var r = ROLES[card.role]; h += banner();
      if (!flipped) h += '<div class="card back" data-act="flip"><div class="big">🂠</div><p>Tocá para ver tu carta</p></div><p class="muted" style="text-align:center">Asegurate de que nadie mire tu pantalla.</p>';
      else {
        h += '<div class="card front" data-act="flip"><div class="big">' + r.e + '</div><h3>' + r.t + '</h3><p>' + r.d + '</p>';
        if (card.role === 'mafia') h += '<p><span class="tag">Tu banda: ' + (card.mates.length ? card.mates.map(esc).join(', ') : 'actuás solo') + '</span></p>';
        h += '</div><p class="muted" style="text-align:center">Tocá la carta para ocultarla.</p>';
      }
    }
  }
  app.innerHTML = h;
}

app.addEventListener('click', function (ev) {
  var el = ev.target.closest('[data-act]');
  if (!el) return;
  var act = el.dataset.act;
  if (act === 'host') startHost();
  else if (act === 'inc' || act === 'dec') {
    var k = el.dataset.k;
    cfg[k] = act === 'inc' ? Math.min(Number(el.dataset.max), cfg[k] + 1) : Math.max(Number(el.dataset.min), cfg[k] - 1);
    sendLobby(); render();
  }
  else if (act === 'deal') deal();
  else if (act === 'pick') { G.pick[el.dataset.k] = G.pick[el.dataset.k] === el.dataset.id ? null : el.dataset.id; render(); }
  else if (act === 'dawn') dawn();
  else if (act === 'tovote') { G.phase = 'vote'; G.msg = ''; broadcast(); render(); }
  else if (act === 'out') out(el.dataset.id);
  else if (act === 'newround') newRound();
  else if (act === 'toggleAll') { showAll = !showAll; render(); }
  else if (act === 'flip') { flipped = !flipped; render(); }
  else if (act === 'share') {
    var link = location.href.split('#')[0] + '#' + code;
    var txt = 'Unite a la Mafia: ' + link + ' (código ' + code + ')';
    if (navigator.share) navigator.share({ text: txt }).catch(function () {});
    else if (navigator.clipboard) navigator.clipboard.writeText(txt).then(function () { el.textContent = '¡Copiado!'; });
  }
  else if (act === 'join') {
    var n = document.getElementById('nm').value.trim(), c = document.getElementById('cd').value.replace(/\D/g, '');
    if (!n || c.length !== 4) { err = 'Escribí tu nombre y el código de 4 números.'; document.activeElement.blur(); render(); return; }
    document.activeElement.blur();
    join(c, n);
  }
});
render();
</script>
</body>
</html>
